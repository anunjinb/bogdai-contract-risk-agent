<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BogdAI — Contract Risk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg:        'var(--bg)',
            surface:   'var(--surface)',
            surface2:  'var(--surface-2)',
            line:      'var(--border)',
            linestrong:'var(--border-strong)',
            fg:        'var(--fg)',
            fg2:       'var(--fg-2)',
            fg3:       'var(--fg-3)',
            accent:    'var(--accent)',
            accentdeep:'var(--accent-deep)',
            accentwash:'var(--accent-wash)',
            brick:     'var(--brick)',
            brickwash: 'var(--brick-wash)',
            red:       'var(--red)',
            redwash:   'var(--red-wash)',
            amber:     'var(--amber)',
            amberwash: 'var(--amber-wash)',
            green:     'var(--green)',
            greenwash: 'var(--green-wash)',
          },
          fontFamily: {
            serif: ['"Source Serif 4"', 'Georgia', 'serif'],
            sans:  ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono:  ['"Geist Mono"', 'ui-monospace', 'monospace'],
          },
          letterSpacing: { eye: '0.14em' },
          boxShadow: {
            soft: '0 2px 8px rgba(20,20,19,0.05), 0 1px 2px rgba(20,20,19,0.04)',
            lift: '0 8px 32px rgba(20,20,19,0.08), 0 2px 6px rgba(20,20,19,0.04)',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --bg:        #faf9f5;
      --surface:   #ffffff;
      --surface-2: #f4f2ea;
      --border:    #d9d6c8;
      --border-strong: #141413;
      --fg:        #141413;
      --fg-2:      #54534d;
      --fg-3:      #87857c;
      --accent:    #2a6df3;
      --accent-deep: #1f55c7;
      --accent-wash: #eaf1fe;
      --brick:     #c25f3f;
      --brick-wash:#faece4;
      --red:       #b1452b;
      --red-wash:  #f9e9e4;
      --amber:     #9a6f1f;
      --amber-wash:#f6efdc;
      --green:     #4f6a43;
      --green-wash:#e9efe4;
      color-scheme: light;
    }
    html.dark {
      --bg:        #131311;
      --surface:   #1c1c1a;
      --surface-2: #232320;
      --border:    #34332e;
      --border-strong: #5a5950;
      --fg:        #f4f2ea;
      --fg-2:      #b4b2a7;
      --fg-3:      #87857c;
      --accent:    #6f9bf7;
      --accent-deep: #8db0f9;
      --accent-wash: #1b2740;
      --brick:     #e08a6b;
      --brick-wash:#3a2620;
      --red:       #e08163;
      --red-wash:  #3a211b;
      --amber:     #d3a64e;
      --amber-wash:#332a17;
      --green:     #8fb07d;
      --green-wash:#1f2b1b;
      color-scheme: dark;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-feature-settings: "ss01", "cv11";
      transition: background 240ms cubic-bezier(0.2,0.7,0.2,1);
    }
    .font-serif { font-feature-settings: normal; }
    ::selection { background: #141413; color: #faf9f5; }
    html.dark ::selection { background: #f4f2ea; color: #141413; }
    *:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-wash); border-radius: 4px; }
    /* tidy scrollbar in dark */
    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 3px solid var(--bg); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes barGrow { from { width: 0; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .anim-fadeUp { animation: fadeUp 520ms cubic-bezier(0.2,0.7,0.2,1) both; }
    .anim-fadeIn { animation: fadeIn 400ms ease both; }
    .spin { animation: spin 0.8s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .anim-fadeUp, .anim-fadeIn { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
